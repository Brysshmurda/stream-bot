name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.143.196.245
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/stream-bot
            git pull origin main
            npm install --omit=dev
            systemctl restart stream-bot
            systemctl status stream-bot --no-pager
